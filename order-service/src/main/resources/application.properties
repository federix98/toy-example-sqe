# order-service (resource service): owns orders, order items and risk results
server.port=8081
server.maxThreads=32

# H2 database owned exclusively by this service (file stored in a Docker volume)
order.jdbcUrl=jdbc:h2:file:./data/orders
# HikariCP connection pool: maximum number of concurrent database connections
order.databasePoolSize=4
# How long a request waits for a free connection before failing with HTTP 503
order.databaseTimeoutMs=2000

pricing.baseUrl=http://localhost:8084
http.client.timeoutMs=5000

tracing.enabled=true
tracing.otlpEndpoint=http://localhost:4318
