# Provisioned automatically when Grafana starts: Tempo is the (only) data source.
apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: true
    editable: false
    jsonData:
      nodeGraph:
        enabled: true
      search:
        hide: false
