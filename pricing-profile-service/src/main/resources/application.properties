# pricing-profile-service (auxiliary service)
# Every key can be overridden with an environment variable, e.g. PRICING_THREAD_POOL_SIZE=4
server.port=8084
server.maxThreads=32

# Fixed-size worker pool that serves price-snapshot and customer-profile requests.
pricing.threadPoolSize=2
# Requests waiting for a free worker; when full, requests are rejected with HTTP 503.
pricing.queueCapacity=50
# Simulated lookup latency per request (holds a worker thread, not CPU).
pricing.processingDelayMs=20

tracing.enabled=true
tracing.otlpEndpoint=http://localhost:4318
