# risk-processing-service (processing service): consumes risk-analysis messages from RabbitMQ
server.port=8083
server.maxThreads=16

# Fixed-size worker pool that executes risk analyses (CPU-bound scoring + HTTP calls)
processing.workerThreads=2
# Jobs waiting for a free worker inside this service; when full, new jobs are REJECTED
processing.queueCapacity=8
# Max. unacknowledged messages RabbitMQ delivers to this service at once (basic.qos).
# With prefetchCount <= workerThreads + queueCapacity surplus messages wait in the RabbitMQ queue.
# With a larger value, bursts overflow the worker pool and the overflowing orders are REJECTED.
processing.prefetchCount=10
# Number of scoring rounds per order (CPU work per job grows linearly with this value)
processing.workFactor=500000

rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.username=guest
rabbitmq.password=guest
rabbitmq.exchange=order-risk
rabbitmq.queue=order-risk-analysis
rabbitmq.routingKey=order.risk.requested

order.baseUrl=http://localhost:8081
pricing.baseUrl=http://localhost:8084
http.client.timeoutMs=5000

tracing.enabled=true
tracing.otlpEndpoint=http://localhost:4318
